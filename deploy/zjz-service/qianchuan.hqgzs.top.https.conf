server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qianchuan.hqgzs.top;

    ssl_certificate     /etc/letsencrypt/live/qianchuan.hqgzs.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qianchuan.hqgzs.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:QIANCHUAN_SSL:10m;
    ssl_session_timeout 1d;

    root /opt/go-qianchuan/frontend/dist;
    index index.html;
    client_max_body_size 100m;
    access_log /www/wwwlogs/qianchuan.hqgzs.top.access.log;
    error_log /www/wwwlogs/qianchuan.hqgzs.top.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_pass_header Set-Cookie;

    location = /mcp {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /oauth/authorize {
        proxy_pass http://127.0.0.1:18081;
        proxy_read_timeout 120s;
    }

    location = /auth/callback {
        proxy_pass http://127.0.0.1:18081;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18081;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:18081;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:18081;
    }

    location = /version {
        proxy_pass http://127.0.0.1:18081;
    }

    location = /metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
    }

    location /swagger/ {
        proxy_pass http://127.0.0.1:18081;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
