server {
    listen 8080;
    server_name qianchuan.hqgzs.top;

    root /opt/go-qianchuan/frontend/dist-dedicated;
    index index.html;
    client_max_body_size 100m;
    access_log /www/wwwlogs/qianchuan.hqgzs.top.source.access.log;
    error_log /www/wwwlogs/qianchuan.hqgzs.top.source.error.log warn;

    location ^~ /mcp {
        proxy_pass http://127.0.0.1:18081/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18081/health;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:18081/healthz;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:18081/ready;
    }

    location = /version {
        proxy_pass http://127.0.0.1:18081/version;
    }

    location = /oauth/authorize {
        proxy_pass http://127.0.0.1:18081/oauth/authorize;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /auth/callback {
        proxy_pass http://127.0.0.1:18081/auth/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 120s;
    }

    location /swagger/ {
        proxy_pass http://127.0.0.1:18081;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
