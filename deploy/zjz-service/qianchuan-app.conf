server {
    listen 8080;
    server_name _;

    root /opt/go-qianchuan/frontend/dist;
    index index.html;
    client_max_body_size 100m;
    access_log /www/wwwlogs/go-qianchuan.access.log;
    error_log /www/wwwlogs/go-qianchuan.error.log warn;

    location = /qianchuan-app {
        return 301 https://dkl4ii67.zjz-service.cn/qianchuan-app/;
    }

    location = /qianchuan-app/health {
        proxy_pass http://127.0.0.1:18081/qianchuan-app/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /qianchuan-app/healthz {
        proxy_pass http://127.0.0.1:18081/qianchuan-app/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /qianchuan-app/ready {
        proxy_pass http://127.0.0.1:18081/qianchuan-app/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /qianchuan-app/version {
        proxy_pass http://127.0.0.1:18081/qianchuan-app/version;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /qianchuan-app/mcp {
        proxy_pass http://127.0.0.1:18081/qianchuan-app/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /qianchuan-app/oauth/authorize {
        proxy_pass http://127.0.0.1:18081/qianchuan-app/oauth/authorize;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /qianchuan-app/auth/callback {
        proxy_pass http://127.0.0.1:18081/qianchuan-app/auth/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /qianchuan-app/api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 120s;
    }

    location /qianchuan-app/swagger/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /qianchuan-app/assets/ {
        alias /opt/go-qianchuan/frontend/dist/assets/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /qianchuan-app/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /qianchuan-app/ {
        try_files /index.html =404;
    }

    location /qianchuan-app/ {
        try_files $uri $uri/ /index.html;
    }
}
